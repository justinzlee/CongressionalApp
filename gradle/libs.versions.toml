[versions]
# CEILING: 9.2.1 — do not raise without checking every contributor's IDE first.
# Android Studio refuses to sync a project whose AGP is newer than the version
# that Studio release supports, and the whole team is on Studio 2026.1, which
# tops out at AGP 9.2.1. Command-line `./gradlew build` does NOT enforce this,
# so a bump can look completely fine locally while breaking Sync for everyone.
# To raise it: everyone upgrades Android Studio first, then bump this line and
# the matching ceiling in .github/workflows/build.yml in the same commit.
agp = "9.4.0"
kotlin = "2.1.10"
playServicesLocation = "21.3.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
okhttp = "4.12.0"
gson = "2.10.1"
exifinterface = "1.3.6"
osmdroid = "6.1.20"

[libraries]
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
osmdroid = { group = "org.osmdroid", name = "osmdroid-android", version.ref = "osmdroid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
